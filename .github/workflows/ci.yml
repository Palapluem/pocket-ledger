name: CI

on:
  pull_request:
    branches: [main, sprint-1-staging]
  push:
    branches: [main, sprint-1-staging]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4
        env:
          # Throwaway credential for an ephemeral CI service container; not a real secret.
          POSTGRES_PASSWORD: ci-disposable
          POSTGRES_DB: pocket_ledger_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pocket_ledger_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:ci-disposable@127.0.0.1:55432/pocket_ledger_test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Mark the throwaway service database as the disposable test database
        run: psql "$TEST_DATABASE_URL" -qc "COMMENT ON DATABASE pocket_ledger_test IS 'pocket-ledger disposable test database'"
      - run: bun install --frozen-lockfile
      - name: Type check
        run: bun run check-types
      - name: Lint (Biome, read-only)
        run: bunx biome check apps packages scripts e2e playwright.config.ts
      - name: Integration tests (real PostgreSQL)
        run: bun test apps/server
      - name: Build web client
        run: bun run build:web
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - name: Browser E2E (real server, built client, PostgreSQL)
        run: bun run test:e2e
