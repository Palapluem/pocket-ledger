# Local production-like run: app image + durable PostgreSQL volume.
# Usage: cp .env.example .env (fill values), then: docker compose up --build
services:
  db:
    image: postgres:18.4
    environment:
      POSTGRES_DB: pocket_ledger
      POSTGRES_USER: pocket_ledger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pocket_ledger -d pocket_ledger"]
      interval: 5s
      retries: 20
  app:
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-local}
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://pocket_ledger:${POSTGRES_PASSWORD}@db:5432/pocket_ledger
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      CORS_ORIGIN: http://localhost:8080
      COOKIE_SECURE: "false"
      RUN_MIGRATIONS: "true"
      SEED_USERS_JSON: ${SEED_USERS_JSON:-}
    ports:
      - "8080:8080"
volumes:
  pgdata:
